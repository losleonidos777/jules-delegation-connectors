[mcp_servers.jules]
command = "node"
args = ["/absolute/path/to/jules-delegation-connectors/bin/jules-mcp.mjs"]
cwd = "/absolute/path/to/jules-delegation-connectors"
env_vars = ["JULES_API_KEY", "JULES_API_BASE_URL", "JULES_STATE_DIR", "JULES_REQUEST_TIMEOUT_MS", "JULES_MAX_RETRIES"]
startup_timeout_sec = 20
tool_timeout_sec = 300
default_tools_approval_mode = "prompt"

# Read-only tools may run without another approval prompt.
[mcp_servers.jules.tools.jules_list_sources]
approval_mode = "approve"
[mcp_servers.jules.tools.jules_list_sessions]
approval_mode = "approve"
[mcp_servers.jules.tools.jules_get_session]
approval_mode = "approve"
[mcp_servers.jules.tools.jules_list_activities]
approval_mode = "approve"
[mcp_servers.jules.tools.jules_get_activity]
approval_mode = "approve"
[mcp_servers.jules.tools.jules_get_plan]
approval_mode = "approve"
[mcp_servers.jules.tools.jules_get_result]
approval_mode = "approve"
[mcp_servers.jules.tools.jules_list_changed_files]
approval_mode = "approve"
[mcp_servers.jules.tools.jules_get_file_diff]
approval_mode = "approve"
[mcp_servers.jules.tools.jules_get_patch]
approval_mode = "approve"
[mcp_servers.jules.tools.jules_get_bash_outputs]
approval_mode = "approve"

# Mutating Jules operations keep an explicit prompt.
[mcp_servers.jules.tools.jules_create_session]
approval_mode = "prompt"
[mcp_servers.jules.tools.jules_approve_plan]
approval_mode = "prompt"
[mcp_servers.jules.tools.jules_send_message]
approval_mode = "prompt"
